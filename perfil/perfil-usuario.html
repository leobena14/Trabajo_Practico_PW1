<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <title>LingoWeb - Perfil de usuario</title>
</head>

<body class="pagina-perfil">
    <nav aria-label="principal" class="principal">
        <strong>LingoWeb</strong>
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="hamburguesa" aria-label="Abrir menú">☰</label>
        <p class="enlaces">
            <a href="../dashboard/dashboard-principal.html">CURSOS</a>
            <a href="../perfil/perfil-usuario.html" class="activo" aria-current="page">PERFIL</a>
            <a href="../ranking/ranking-bronce.html">RANKING</a>
            <a href="../tienda/tienda.html">TIENDA</a>
        </p>
    </nav>

    <main class="contenedor-prin">
        <section class="perfil-usuario">
            <figure>
                <img src="../img/avatar-05.png" alt="Foto de perfil" id="perfil-avatar">
            </figure>
            <div class="dato-linea">
                <h2 id="perfil-nombre"></h2>
                <button type="button" class="btn-editar" data-modal="modal-nombre">Editar</button>
            </div>
            <div class="dato-linea">
                <p id="perfil-usuario"></p>
                <button type="button" class="btn-editar" data-modal="modal-usuario">Editar</button>
            </div>
            <p id="perfil-miembro"></p>
            <section class="logros">
                <h3>Logros Académicos</h3>
                <ul>
                    <li><strong>Insignias: </strong><span id="perfil-insignias"></span></li>
                    <li><strong>Racha: </strong><span id="perfil-racha"></span></li>
                    <li><strong>Total XP: </strong><span id="perfil-xp"></span></li>
                </ul>
            </section>
        </section>

        <section class="bloque-der">
            <p id="mensaje-perfil" class="mensaje-ok" role="status"></p>

            <form id="form-perfil" novalidate>
                <section class="datos-usuario">
                    <div class="datos">
                        <div class="dato-email">
                            <strong>Email registrado: </strong>
                            <span id="perfil-email"></span>
                            <button type="button" class="btn-editar" data-modal="modal-email">Editar</button>
                        </div>
                        <p><strong>Plan: </strong><span id="perfil-plan"></span></p>
                    </div>
                    <fieldset class="form">
                        <legend>Actualización de contraseña (opcional)</legend>
                        <p class="grupo-datos">
                            <label for="password"><strong>Contraseña actual:</strong></label>
                            <input type="password" id="password" name="contraseña-actual" class="input">
                        </p>
                        <p class="grupo-datos">
                            <label for="nueva-contraseña">Nueva contraseña:</label>
                            <input type="password" id="nueva-contraseña" name="nueva-contraseña" class="input">
                        </p>
                        <p class="grupo-datos">
                            <label for="confirmar-contraseña">Confirmar contraseña:</label>
                            <input type="password" id="confirmar-contraseña" name="confirmar-contraseña" class="input">
                        </p>
                    </fieldset>
                    <fieldset class="form">
                        <label for="idioma">Idioma principal
                            <select id="idioma" name="idioma">
                                <option value="es">Español</option>
                                <option value="en">Inglés</option>
                                <option value="de">Alemán</option>
                            </select>
                        </label>
                    </fieldset>
                </section>

                <p id="mensaje-form" class="mensaje-error" role="alert"></p>

                <section class="botones">
                    <button type="submit" class="boton-guardar">Guardar Cambios</button>
                    <button type="button" class="boton-cancelar" id="boton-cerrar-sesion">Cerrar Sesión</button>
                </section>
            </form>
        </section>

        <section class="ventana-editar">
            <dialog id="modal-nombre" class="modal-edicion">
                <form class="form-modal" novalidate>
                    <h3>Cambiar Nombre</h3>
                    <div class="campo">
                        <label for="nuevo-nombre">Nuevo Nombre:</label>
                        <input type="text" id="nuevo-nombre" name="nuevo_nombre">
                    </div>
                    <div class="campo">
                        <label for="pass-nombre">Contraseña actual:</label>
                        <input type="password" id="pass-nombre" name="password" class="input">
                    </div>
                    <p class="mensaje-error" role="alert"></p>
                    <div class="modal-acciones">
                        <button type="submit" class="boton-guardar">Guardar</button>
                        <button type="button" class="boton-cerrar">Cancelar</button>
                    </div>
                </form>
            </dialog>

            <dialog id="modal-usuario" class="modal-edicion">
                <form class="form-modal" novalidate>
                    <h3>Cambiar Nombre de Usuario</h3>
                    <div class="campo">
                        <label for="nuevo-usuario">Nuevo Usuario:</label>
                        <input type="text" id="nuevo-usuario" name="nuevo_usuario">
                    </div>
                    <div class="campo">
                        <label for="pass-usuario">Contraseña actual:</label>
                        <input type="password" id="pass-usuario" name="password" class="input">
                    </div>
                    <p class="mensaje-error" role="alert"></p>
                    <div class="modal-acciones">
                        <button type="submit" class="boton-guardar">Guardar</button>
                        <button type="button" class="boton-cerrar">Cancelar</button>
                    </div>
                </form>
            </dialog>

            <dialog id="modal-email" class="modal-edicion">
                <form class="form-modal" novalidate>
                    <h3>Cambiar Email</h3>
                    <div class="campo">
                        <label for="nuevo-email">Nuevo Email:</label>
                        <input type="email" id="nuevo-email" name="nuevo_email">
                    </div>
                    <div class="campo">
                        <label for="pass-email">Contraseña actual:</label>
                        <input type="password" id="pass-email" name="password" class="input">
                    </div>
                    <p class="mensaje-error" role="alert"></p>
                    <div class="modal-acciones">
                        <button type="submit" class="boton-guardar">Guardar</button>
                        <button type="button" class="boton-cerrar">Cancelar</button>
                    </div>
                </form>
            </dialog>
        </section>
    </main>

    <script type="module" src="../js/perfil.js"></script>
</body>

</html>
