<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="pagina-compra">
    <nav aria-label="principal" class="principal">
        <strong>LingoWeb</strong>
        <input type="checkbox" id="menu-toggle">
        <label for="menu-toggle" class="hamburguesa" aria-label="Abrir menú">☰</label>
        <p class="enlaces">
            <a href="../dashboard/dashboard-principal.html">CURSOS</a>
            <a href="../perfil/perfil-usuario.html">PERFIL</a>
            <a href="../ranking/ranking-personal.html">RANKING</a>
            <a href="../tienda/tienda.html" class="activo" aria-current="page">TIENDA</a>
        </p>
    </nav>

    <main>
        <form novalidate>
            <fieldset>
                <h1>DATOS DE LA TARJETA</h1>
                <p id="titulo-plan"></p>

                <label for="name">Nombre en la tarjeta</label>
                <input type="text" id="name" name="name" placeholder="Pepe Grillo" required>

                <label for="cardNumber">Número de tarjeta</label>
                <input type="text" id="cardNumber" name="cardNumber" maxlength="19" placeholder="1234 5678 9012 3456" inputmode="numeric" required>

                <label for="expiry">Vencimiento</label>
                <input type="text" id="expiry" name="expiry" placeholder="MM/AA" maxlength="5" inputmode="numeric"required>

                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" maxlength="3" placeholder="123" inputmode="numeric" required>

                <p id="mensaje" class="mensaje-error" role="alert"></p>

                <button type="submit" id="boton-comprar" class="boton-comprar">Comprar</button>
            </fieldset>
        </form>

        <a href="../tienda/tienda.html" class="cancelar">Cancelar</a>
    </main>

    <script type="module" src="../js/tarjeta.js"></script>
</body>
