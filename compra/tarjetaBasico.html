<body class="pagina-compra">
  <nav aria-label="principal" class="principal">
    <strong>LingoWeb</strong>
    <input type="checkbox" id="menu-toggle">

    <main>
        <form action="compraExitosa.html">
            <fieldset>
                <h1>
                    DATOS DE LA TARJETA
                </h1>

                <label for="name">Nombre en la tarjeta</label>
                <input type="text" id="name" name="name" required>

                <label for="cardNumber">Número de tarjeta</label>
                <input type="text" id="cardNumber" name="cardNumber" maxlength="19" required>

                <label for="expiry">Vencimiento</label>
                <input type="text" id="expiry" name="expiry" placeholder="MM/AA" maxlength="5" required>

                <label for="cvv">CVV</label>
                <input type="text" id="cvv" name="cvv" maxlength="4" required>

                <button type="submit" class="boton-comprar">Comprar — ARS 30.000,00</button>
            </fieldset>
        </form>

        <a href="../tienda/tienda.html" class="cancelar">Cancelar</a>

    </main>
