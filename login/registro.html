<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <title>Registro LingoWeb</title>
</head>
<body class="pagina-login">
    <header>
        <img src="../img/logo-lingoweb.png" alt="Logo LingoWeb">
        <p class="eslogan">Aprende idiomas de una forma divertida </p>
    </header>
    <main>
            <h1> Registrarse</h1>
            <form>
            <label for="email">Email:</label><input id="email" type="email" required >
            <label for="contrasena">Contraseña:</label><input  id="contrasena" type="password" required>
            <label for="nombre"> Nombre y Apellido:</label><input id="nombre" type="text" required>
            <label for="usuario"> Nombre de Usuario:</label><input id="usuario" type="text" required>
            <label for="edad">Edad:</label><input id="edad" type="number" required>
            <button type="submit">Registrarse</button>
            <a href="../index.html" class="login">  Volver a Login </a>
    </form>
    
</main>
<script type="module" src="../js/registro.js"></script>
</body>

</html>
